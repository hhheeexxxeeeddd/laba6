<script>
  (function() {
    const tabPhone = document.getElementById('tab-phone');
    const tabEmail = document.getElementById('tab-email');
    const phoneContainer = document.getElementById('phone-container');
    const emailContainer = document.getElementById('email-container');
    const phoneInput = document.getElementById('phone-input');
    const clearPhone = document.getElementById('clear-phone');

    function selectTab(activeTab) {
      if (activeTab === 'phone') {
        tabPhone.className = 'flex-1 py-2.5 px-4 text-xs font-semibold rounded-lg bg-surface shadow-sm text-on-surface transition-all duration-200 flex items-center justify-center gap-1.5 cursor-pointer';
        tabEmail.className = 'flex-1 py-2.5 px-4 text-xs font-medium rounded-lg text-secondary hover:text-on-surface transition-all duration-200 flex items-center justify-center gap-1.5 cursor-pointer';
        phoneContainer.classList.remove('hidden');
        emailContainer.classList.add('hidden');
        phoneInput.focus();
      } else {
        tabEmail.className = 'flex-1 py-2.5 px-4 text-xs font-semibold rounded-lg bg-surface shadow-sm text-on-surface transition-all duration-200 flex items-center justify-center gap-1.5 cursor-pointer';
        tabPhone.className = 'flex-1 py-2.5 px-4 text-xs font-medium rounded-lg text-secondary hover:text-on-surface transition-all duration-200 flex items-center justify-center gap-1.5 cursor-pointer';
        emailContainer.classList.remove('hidden');
        phoneContainer.classList.add('hidden');
        document.getElementById('email-input').focus();
      }
    }

    if (tabPhone && tabEmail) {
      tabPhone.addEventListener('click', () => selectTab('phone'));
      tabEmail.addEventListener('click', () => selectTab('email'));
    }

    if (phoneInput) {
      phoneInput.addEventListener('input', function(e) {
        let val = e.target.value.replace(/\D/g, '');
        if (val.startsWith('7')) val = val.substring(1);
        if (val.startsWith('8')) val = val.substring(1);

        let formatted = '';
        if (val.length > 0) {
          formatted += '(' + val.substring(0, 3);
        }
        if (val.length >= 4) {
          formatted += ') ' + val.substring(3, 6);
        }
        if (val.length >= 7) {
          formatted += '-' + val.substring(6, 8);
        }
        if (val.length >= 9) {
          formatted += '-' + val.substring(8, 10);
        }

        e.target.value = formatted;
        if (clearPhone) {
          clearPhone.classList.toggle('hidden', formatted.length === 0);
        }
      });
    }

    if (clearPhone && phoneInput) {
      clearPhone.addEventListener('click', function() {
        phoneInput.value = '';
        clearPhone.classList.add('hidden');
        phoneInput.focus();
      });
    }
  })();
</script></main>
