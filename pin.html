rface-container hover:bg-surface-container-high active:scale-95 transition-all text-2xl font-medium text-on-surface font-body flex items-center justify-center shadow-sm" onclick="pressKey('8')" type="button">8</button><button class="keypad-btn h-14 py-3 rounded-2xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-2xl font-medium text-on-surface font-body flex items-center justify-center shadow-sm" onclick="pressKey('9')" type="button">9</button><button aria-label="Очистить все" class="keypad-btn h-14 py-3 rounded-2xl bg-surface-container-low hover:bg-surface-container text-secondary flex items-center justify-center active:scale-95 transition-all" onclick="clearAll()" type="button"><span class="text-sm font-semibold uppercase tracking-wider font-body">C</span></button><button class="keypad-btn h-14 py-3 rounded-2xl bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-2xl font-medium text-on-surface font-body flex items-center justify-center shadow-sm" onclick="pressKey('0')" type="button">0</button><button aria-label="Удалить последнюю цифру" class="keypad-btn h-14 py-3 rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface active:scale-95 transition-all flex items-center justify-center" onclick="deleteKey()" type="button"><span class="material-symbols-outlined text-[22px]">backspace</span></button></div>

<button class="w-full h-14 rounded-2xl bg-primary text-on-primary font-bold text-base shadow-[0_2px_12px_rgba(194,101,42,0.22)] active:scale-[0.99] transition-all flex items-center justify-center gap-2 mb-5 cursor-pointer font-body" id="verifyCta" onclick="handleVerify()" type="button"><span class="">Подтвердить</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button>
<!-- Bottom Assistive Actions & Security Note -->

</div>

<script>
  let currentOtp = "";
  let secondsRemaining = 45;
  let timerInterval = null;

  function renderOtpBoxes() {
    const container = document.getElementById("otpContainer");
    if (!container) return;

    let html = "";
    for (let i = 0; i < 4; i++) {
      if (i < currentOtp.length) {
        html += `
          <div class="w-12 sm:w-14 h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center transition-all duration-200">
            <span class="text-2xl font-semibold text-on-surface font-label">${currentOtp[i]}</span>
          </div>`;
      } else if (i === currentOtp.length) {
        html += `
          <div class="w-12 sm:w-14 h-14 rounded-xl bg-primary/10 shadow-[0_0_0_2px_#c2652a] flex flex-col items-center justify-center transition-all duration-200 relative">
            <span class="w-0.5 h-6 bg-primary animate-pulse rounded-full"></span>
          </div>`;
      } else {
        html += `
          <div class="w-12 sm:w-14 h-14 rounded-xl bg-surface-container-low flex flex-col items-center justify-center transition-all duration-200">
            <span class="w-2 h-2 rounded-full bg-outline-variant"></span>
          </div>`;
      }
    }
    container.innerHTML = html;

    const cta = document.getElementById("verifyCta");
    if (cta) {
      if (currentOtp.length === 4) {
        cta.classList.remove("opacity-70");
      } else {
        cta.classList.add("opacity-90");
      }
    }
  }

  function pressKey(num) {
    if (currentOtp.length < 4) {
      currentOtp += num;
      renderOtpBoxes();
      if (currentOtp.length === 4) {
        setTimeout(handleVerify, 350);
      }
    }
  }

  function deleteKey() {
    if (currentOtp.length > 0) {
      currentOtp = currentOtp.slice(0, -1);
      renderOtpBoxes();
    }
  }

  function clearAll() {
    currentOtp = "";
    renderOtpBoxes();
  }

  function handleVerify() {
    if (currentOtp.length === 4) {
      const cta = document.getElementById("verifyCta");
      if (cta) {
        cta.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Проверка кода...</span>';
      }
      setTimeout(() => {
        Auth.afterPin(currentOtp);
        if (cta) {
          cta.innerHTML = '<span>Готово</span><span class="material-symbols-outlined text-[18px]">check</span>';
        }
      }, 700);
    } else {
      alert("Введите все 4 цифры ПИН-кода.");
    }
  }

  function startCountdown() {
    if (timerInterval) clearInterval(timerInterval);
    const timerText = document.getElementById("countdownTimer");
    const timerBlock = document.getElementById("timerContainer");
    const resendBtn = document.getElementById("resendBtn");

    timerInterval = setInterval(() => {
      secondsRemaining--;
      if (secondsRemaining <= 0) {
        clearInterval(timerInterval);
        if (timerBlock) timerBlock.classList.add("hidden");
        if (resendBtn) resendBtn.classList.remove("hidden");
      } else {
        const secString = secondsRemaining < 10 ? "0" + secondsRemaining : secondsRemaining;
        if (timerText) timerText.textContent = "00:" + secString;
      }
    }, 1000);
  }

  function resetTimer() {
    secondsRemaining = 45;
    const timerBlock = document.getElementById("timerContainer");
    const resendBtn = document.getElementById("resendBtn");
    const timerText = document.getElementById("countdownTimer");

    if (timerBlock) timerBlock.classList.remove("hidden");
    if (resendBtn) resendBtn.classList.add("hidden");
    if (timerText) timerText.textContent = "00:45";

    currentOtp = "";
    renderOtpBoxes();
    startCountdown();
  }

  // Keyboard navigation support
  window.addEventListener("keydown", (e) => {
    if (/^[0-9]$/.test(e.key)) {
      pressKey(e.key);
    } else if (e.key === "Backspace") {
      deleteKey();
    } else if (e.key === "Enter") {
      handleVerify();
    }
  });

  // Init timer on load
  renderOtpBoxes();
</script></main>
